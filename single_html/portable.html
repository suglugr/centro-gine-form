<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        /* SCREEN STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            border: 1px solid #444444;
            padding: 20px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
        }

        .section-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444444;
            color: #ffffff;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nombre-group {
            flex: 2;
            min-width: 250px;
        }

        .edad-group {
            flex: 0 0 80px;
        }

        .fecha-group {
            flex: 0 0 150px;
        }

        label {
            color: #ffffff;
            font-size: 14px;
        }

        .input-underline {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #ffffff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 5px;
            outline: none;
            width: 100%;
        }

        .input-underline:focus {
            border-bottom-color: #888888;
        }

        .input-underline::placeholder {
            color: #666666;
            font-weight: normal;
        }

        .input-small {
            width: 80px;
        }

        textarea.input-underline {
            resize: vertical;
            min-height: 100px;
            border: 2px solid #ffffff;
            padding: 10px;
        }

        input[readonly] {
            color: #cccccc;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ffffff;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #333333;
            color: #ffffff;
        }

        .btn:hover {
            background-color: #555555;
        }

        .btn-secondary {
            background-color: transparent;
        }

        .print-only {
            display: none;
        }

        .records-section {
            margin-top: 30px;
        }

        .records-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #444444;
        }

        .record-item {
            padding: 15px;
            border-bottom: 1px solid #444444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-item:hover {
            background-color: #2a2a2a;
        }

        .record-info {
            flex: 1;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .search-input {
            background-color: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            width: 100%;
            max-width: 400px;
            outline: none;
            margin-bottom: 15px;
        }
    </style>

    <!-- PRINT ONLY STYLES -->
    <style type="text/css" media="print">
        @page {
            size: letter;
            margin-top: 4cm;
            margin-bottom: 1cm;
            margin-left: 0.9cm;
            margin-right: 0.9cm;
        }

        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        html, body {
            background: white !important;
            color: black !important;
            font-family: 'Times New Roman', Times, serif !important;
            font-size: 12pt !important;
            font-weight: normal !important;
            line-height: 1.6 !important;
            width: 100% !important;
            height: 100% !important;
        }

        .container {
            max-width: none !important;
            width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .main-content {
            width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .screen-only {
            display: none !important;
            visibility: hidden !important;
        }

        .print-only {
            display: block !important;
            visibility: visible !important;
            width: 100% !important;
            position: relative !important;
        }

        /* FIRST LINE - ABSOLUTE POSITIONING */
        .print-line-1 {
            position: relative !important;
            width: 100% !important;
            height: 20pt !important;
            margin-bottom: 20pt !important;
            display: block !important;
        }

        /* NAME - LEFT */
        #p-nombre {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            font-size: 12pt !important;
            font-weight: normal !important;
            text-decoration: none !important;
        }

        /* AGE - RIGHT SIDE */
        #p-edad {
            position: absolute !important;
            right: 120pt !important;
            top: 0 !important;
            font-size: 12pt !important;
            font-weight: normal !important;
            text-decoration: none !important;
        }

        /* DATE - FAR RIGHT */
        #p-fecha {
            position: absolute !important;
            right: 0 !important;
            top: 0 !important;
            font-size: 12pt !important;
            font-weight: normal !important;
            text-decoration: none !important;
        }

        /* INDICACIONES */
        .print-line-2 {
            display: block !important;
            width: 100% !important;
            font-size: 12pt !important;
            font-weight: normal !important;
            text-decoration: none !important;
            line-height: 1.8 !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            text-align: left !important;
            margin-top: 10pt !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            
            <!-- SCREEN FORM -->
            <div class="screen-only">
                <!-- SECTION 1 -->
                <div class="section section-1">
                    <div class="section-header">SECCION 1 - DATOS PERSONALES</div>
                    <div class="form-row">
                        <div class="form-group nombre-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required class="input-underline">
                        </div>
                        <div class="form-group edad-group">
                            <label for="edad">Edad:</label>
                            <input type="text" id="edad" name="edad" readonly class="input-underline input-small">
                        </div>
                        <div class="form-group fecha-group">
                            <label for="fecha_impresion">Fecha:</label>
                            <input type="text" id="fecha_impresion" name="fecha_impresion" readonly class="input-underline">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de Nacimiento (dd/mm/yyyy):</label>
                            <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" 
                                   placeholder="dd/mm/yyyy" required class="input-underline">
                        </div>
                    </div>
                </div>

                <!-- SECTION 2 -->
                <div class="section section-2">
                    <div class="section-header">SECCION 2 - INDICACIONES</div>
                    <div class="form-group">
                        <label for="indicaciones">Indicaciones:</label>
                        <textarea id="indicaciones" name="indicaciones" rows="8" class="input-underline"></textarea>
                    </div>
                </div>

                <!-- SECTION 3 -->
                <div class="section section-3">
                    <div class="section-header">SECCION 3 - NOTAS DE EXPEDIENTE (INTERNO)</div>
                    <div class="form-group">
                        <label for="notas">Notas de Expediente:</label>
                        <textarea id="notas" name="notas" rows="10" class="input-underline"></textarea>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="button-container">
                    <button type="button" id="btn-print" class="btn">GUARDAR E IMPRIMIR</button>
                    <button type="button" id="btn-save" class="btn btn-secondary">SOLO GUARDAR</button>
                    <button type="button" id="btn-new" class="btn btn-secondary">NUEVO REGISTRO</button>
                    <button type="button" id="btn-export" class="btn btn-secondary">EXPORTAR DATOS</button>
                    <button type="button" id="btn-import" class="btn btn-secondary">IMPORTAR DATOS</button>
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </div>

                <!-- RECORDS SECTION -->
                <div class="section records-section">
                    <div class="section-header">REGISTROS GUARDADOS</div>
                    <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre...">
                    <div class="records-list" id="records-list"></div>
                </div>
            </div>

            <!-- PRINT AREA -->
            <div class="print-only" id="print-area">
                <div class="print-line-1">
                    <span id="p-nombre"></span>
                    <span id="p-edad"></span>
                    <span id="p-fecha"></span>
                </div>
                <div class="print-line-2" id="p-indicaciones"></div>
            </div>

        </div>
    </div>

    <script>
        const DB_KEY = 'formulario_records';
        let currentRecordId = null;

        function getRecords() {
            const data = localStorage.getItem(DB_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveRecords(records) {
            localStorage.setItem(DB_KEY, JSON.stringify(records));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function updatePrintValues() {
            document.getElementById('p-nombre').textContent = document.getElementById('nombre').value;
            document.getElementById('p-edad').textContent = document.getElementById('edad').value;
            document.getElementById('p-fecha').textContent = document.getElementById('fecha_impresion').value;
            document.getElementById('p-indicaciones').textContent = document.getElementById('indicaciones').value;
        }

        function setTodayDate() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            document.getElementById('fecha_impresion').value = day + '/' + month + '/' + year;
            updatePrintValues();
        }

        function calculateAge(birthDateStr) {
            const parts = birthDateStr.split('/');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                
                const birthDate = new Date(year, month, day);
                const today = new Date();
                
                let age = today.getFullYear() - birthDate.getFullYear();
                const monthDiff = today.getMonth() - birthDate.getMonth();
                
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                
                document.getElementById('edad').value = age;
                updatePrintValues();
            }
        }

        document.getElementById('fecha_nacimiento').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            if (value.length >= 5) {
                value = value.substring(0, 5) + '/' + value.substring(5, 9);
            }
            e.target.value = value;

            if (value.length === 10) {
                calculateAge(value);
            }
        });

        document.getElementById('nombre').addEventListener('input', updatePrintValues);
        document.getElementById('indicaciones').addEventListener('input', updatePrintValues);

        function validateForm() {
            const nombre = document.getElementById('nombre').value.trim();
            const fechaNacimiento = document.getElementById('fecha_nacimiento').value.trim();
            const edad = document.getElementById('edad').value.trim();
            const fechaImpresion = document.getElementById('fecha_impresion').value.trim();

            if (!nombre || !fechaNacimiento || !edad || !fechaImpresion) {
                alert('Por favor complete todos los campos obligatorios de la Seccion 1.');
                return false;
            }
            return true;
        }

        function saveRecord(callback) {
            if (!validateForm()) return;

            const records = getRecords();
            
            const recordData = {
                nombre: document.getElementById('nombre').value,
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
                edad: document.getElementById('edad').value,
                fecha_impresion: document.getElementById('fecha_impresion').value,
                indicaciones: document.getElementById('indicaciones').value,
                notas: document.getElementById('notas').value,
                updated_at: new Date().toISOString()
            };

            if (currentRecordId) {
                const index = records.findIndex(r => r.id === currentRecordId);
                if (index !== -1) {
                    recordData.id = currentRecordId;
                    recordData.created_at = records[index].created_at;
                    records[index] = recordData;
                }
            } else {
                recordData.id = generateId();
                recordData.created_at = new Date().toISOString();
                records.push(recordData);
                currentRecordId = recordData.id;
            }

            saveRecords(records);
            displayRecords();
            alert('Registro guardado exitosamente.');

            if (callback) callback();
        }

        function loadRecord(id) {
            const records = getRecords();
            const record = records.find(r => r.id === id);
            
            if (record) {
                currentRecordId = record.id;
                document.getElementById('nombre').value = record.nombre || '';
                document.getElementById('fecha_nacimiento').value = record.fecha_nacimiento || '';
                document.getElementById('edad').value = record.edad || '';
                setTodayDate();
                document.getElementById('indicaciones').value = record.indicaciones || '';
                document.getElementById('notas').value = record.notas || '';
                updatePrintValues();
            }
        }

        function deleteRecord(id) {
            if (confirm('Esta seguro de eliminar este registro?')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecords(records);
                
                if (currentRecordId === id) {
                    clearForm();
                }
                
                displayRecords();
            }
        }

        function clearForm() {
            currentRecordId = null;
            document.getElementById('nombre').value = '';
            document.getElementById('fecha_nacimiento').value = '';
            document.getElementById('edad').value = '';
            document.getElementById('indicaciones').value = '';
            document.getElementById('notas').value = '';
            setTodayDate();
            updatePrintValues();
        }

        function displayRecords(searchTerm = '') {
            const records = getRecords();
            const container = document.getElementById('records-list');
            
            const filtered = records.filter(r => 
                r.nombre.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="record-item">No se encontraron registros.</div>';
                return;
            }

            container.innerHTML = filtered.map(record => `
                <div class="record-item">
                    <div class="record-info">
                        <strong>${record.nombre}</strong> - Edad: ${record.edad} - ${record.fecha_impresion}
                    </div>
                    <div class="record-actions">
                        <button class="btn btn-small" onclick="loadRecord('${record.id}')">CARGAR</button>
                        <button class="btn btn-small btn-secondary" onclick="deleteRecord('${record.id}')">ELIMINAR</button>
                    </div>
                </div>
            `).join('');
        }

        function exportData() {
            const records = getRecords();
            const dataStr = JSON.stringify(records, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'registros_backup_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedRecords = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedRecords)) {
                        throw new Error('Invalid format');
                    }

                    const existingRecords = getRecords();
                    const merged = [...existingRecords];

                    importedRecords.forEach(imported => {
                        const exists = merged.find(r => r.id === imported.id);
                        if (!exists) {
                            merged.push(imported);
                        }
                    });

                    saveRecords(merged);
                    displayRecords();
                    alert('Datos importados exitosamente. Total: ' + merged.length + ' registros.');
                } catch (error) {
                    alert('Error al importar: Archivo no valido.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function printDocument() {
            if (!validateForm()) return;
            updatePrintValues();
            saveRecord(function() {
                window.print();
            });
        }

        window.onbeforeprint = function() {
            document.title = ' ';
        };
        
        window.onafterprint = function() {
            document.title = 'Formulario de Registro';
        };

        document.getElementById('btn-print').addEventListener('click', printDocument);
        document.getElementById('btn-save').addEventListener('click', function() {
            saveRecord();
        });
        document.getElementById('btn-new').addEventListener('click', clearForm);
        document.getElementById('btn-export').addEventListener('click', exportData);
        document.getElementById('btn-import').addEventListener('click', function() {
            document.getElementById('import-file').click();
        });
        document.getElementById('import-file').addEventListener('change', importData);
        document.getElementById('search-input').addEventListener('input', function(e) {
            displayRecords(e.target.value);
        });

        window.addEventListener('load', function() {
            setTodayDate();
            displayRecords();
        });
    </script>
</body>
</html>
