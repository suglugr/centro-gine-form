<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal de Captura Hayear</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; }
        video { width: 90%; max-width: 1100px; border: 3px solid #444; border-radius: 8px; margin-top: 20px; background: #000; }
        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; }
        .flash.active { animation: flash-anim 0.2s ease-out; }
        @keyframes flash-anim { from { opacity: 1; } to { opacity: 0; } }
        .status { color: #27ae60; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Alimentación en Vivo - Microscopio</h2>
    <p>Presiona el <strong>Pedal (Tecla B)</strong> para guardar en Descargas</p>
    <div id="flash-overlay" class="flash"></div>
    <video id="video" autoplay playsinline></video>
    <div class="status" id="status">Cámara Lista</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const flash = document.getElementById('flash-overlay');

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
            } catch (err) {
                document.getElementById('status').innerText = "Error: " + err.message;
            }
        }

        function takeSnapshot() {
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 200);
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.download = `CAPTURA_${Date.now()}.jpg`;
            link.click();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyB') { e.preventDefault(); takeSnapshot(); }
        });
        init();
    </script>
</body>
</html>
