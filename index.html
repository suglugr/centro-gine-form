<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            
            <!-- SCREEN FORM -->
            <div class="screen-only">
                <!-- SECTION 1 -->
                <div class="section section-1">
                    <div class="section-header">SECCION 1 - DATOS PERSONALES</div>
                    <div class="form-row">
                        <div class="form-group nombre-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required class="input-underline">
                        </div>
                        <div class="form-group edad-group">
                            <label for="edad">Edad:</label>
                            <input type="text" id="edad" name="edad" readonly class="input-underline input-small">
                        </div>
                        <div class="form-group fecha-group">
                            <label for="fecha_impresion">Fecha:</label>
                            <input type="text" id="fecha_impresion" name="fecha_impresion" readonly class="input-underline">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de Nacimiento (dd/mm/yyyy):</label>
                            <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" 
                                   placeholder="dd/mm/yyyy" required class="input-underline">
                        </div>
                    </div>
                </div>

                <!-- SECTION 2 -->
                <div class="section section-2">
                    <div class="section-header">SECCION 2 - INDICACIONES</div>
                    <div class="form-group">
                        <label for="indicaciones">Indicaciones:</label>
                        <textarea id="indicaciones" name="indicaciones" rows="8" class="input-underline"></textarea>
                    </div>
                </div>

                <!-- SECTION 3 -->
                <div class="section section-3">
                    <div class="section-header">SECCION 3 - NOTAS DE EXPEDIENTE (INTERNO)</div>
                    <div class="form-group">
                        <label for="notas">Notas de Expediente:</label>
                        <textarea id="notas" name="notas" rows="10" class="input-underline"></textarea>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="button-container">
                    <button type="button" id="btn-print" class="btn btn-primary">GUARDAR E IMPRIMIR</button>
                    <button type="button" id="btn-save" class="btn btn-secondary">SOLO GUARDAR</button>
                    <a href="records.html" class="btn btn-link">VER REGISTROS</a>
                </div>
            </div>

            <!-- PRINT AREA -->
            <div class="print-only" id="print-area">
                <div class="print-line-1">
                    <span id="p-nombre"></span>
                    <span id="p-edad"></span>
                    <span id="p-fecha"></span>
                </div>
                <div class="print-line-2" id="p-indicaciones"></div>
            </div>

        </div>
    </div>

    <script>
        function updatePrintValues() {
            document.getElementById('p-nombre').textContent = document.getElementById('nombre').value;
            document.getElementById('p-edad').textContent = document.getElementById('edad').value;
            document.getElementById('p-fecha').textContent = document.getElementById('fecha_impresion').value;
            document.getElementById('p-indicaciones').textContent = document.getElementById('indicaciones').value;
        }

        function setTodayDate() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            document.getElementById('fecha_impresion').value = day + '/' + month + '/' + year;
            updatePrintValues();
        }

        document.getElementById('fecha_nacimiento').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            if (value.length >= 5) {
                value = value.substring(0, 5) + '/' + value.substring(5, 9);
            }
            e.target.value = value;

            if (value.length === 10) {
                calculateAge(value);
            }
        });

        function calculateAge(birthDateStr) {
            const parts = birthDateStr.split('/');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                
                const birthDate = new Date(year, month, day);
                const today = new Date();
                
                let age = today.getFullYear() - birthDate.getFullYear();
                const monthDiff = today.getMonth() - birthDate.getMonth();
                
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                
                document.getElementById('edad').value = age;
                updatePrintValues();
            }
        }

        document.getElementById('nombre').addEventListener('input', updatePrintValues);
        document.getElementById('indicaciones').addEventListener('input', updatePrintValues);

        window.addEventListener('load', function() {
            setTodayDate();

            const urlParams = new URLSearchParams(window.location.search);
            const recordId = urlParams.get('id');
            if (recordId) {
                loadRecord(recordId);
            }
        });

        function loadRecord(id) {
            fetch('load_record.php?id=' + id)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('nombre').value = data.record.nombre || '';
                        document.getElementById('fecha_nacimiento').value = data.record.fecha_nacimiento || '';
                        document.getElementById('edad').value = data.record.edad || '';
                        setTodayDate();
                        document.getElementById('indicaciones').value = data.record.indicaciones || '';
                        document.getElementById('notas').value = data.record.notas || '';
                        updatePrintValues();
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function validateForm() {
            const nombre = document.getElementById('nombre').value.trim();
            const fechaNacimiento = document.getElementById('fecha_nacimiento').value.trim();
            const edad = document.getElementById('edad').value.trim();
            const fechaImpresion = document.getElementById('fecha_impresion').value.trim();

            if (!nombre || !fechaNacimiento || !edad || !fechaImpresion) {
                alert('Por favor complete todos los campos obligatorios de la Seccion 1.');
                return false;
            }
            return true;
        }

        function saveRecord(callback) {
            if (!validateForm()) return;

            const data = {
                nombre: document.getElementById('nombre').value,
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
                edad: document.getElementById('edad').value,
                fecha_impresion: document.getElementById('fecha_impresion').value,
                indicaciones: document.getElementById('indicaciones').value,
                notas: document.getElementById('notas').value
            };

            fetch('save_record.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('Registro guardado exitosamente.');
                    if (callback) callback();
                } else {
                    alert('Error al guardar: ' + result.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error de conexion.');
            });
        }

        function printDocument() {
            if (!validateForm()) return;
            updatePrintValues();
            saveRecord(function() {
                window.print();
            });
        }

        window.onbeforeprint = function() {
            document.title = ' ';
        };
        
        window.onafterprint = function() {
            document.title = 'Formulario de Registro';
        };

        document.getElementById('btn-print').addEventListener('click', printDocument);
        document.getElementById('btn-save').addEventListener('click', function() {
            saveRecord();
        });
    </script>
</body>
</html>
